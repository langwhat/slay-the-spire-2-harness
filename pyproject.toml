[project]
name = "sts2-harness"
version = "0.1.0"
description = "No-save/load game-playing core"
requires-python = ">=3.12"
dependencies = [
    "httpx2[socks]>=2.16,<3",
    "openai==3.39.0",
    "pydantic>=2.14,<3",
    "python-dotenv>=1.2,<2",
    "starlette>=0.50,<1",
    "uvicorn>=0.38,<1",
]

[project.scripts]
sts2 = "sts2_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pyright>=1.1.407,<2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
